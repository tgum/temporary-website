				<div id="jimmorrison">
	<div id="jim-talk">
		<div id="jim-text">Hi. I'm Jim Morrison from the doors.</div>
		<input type="text" id="jim-input">
	</div>
	<img title="Jim Morrison" alt="Jim Morrison" id="jim-face" src="/imgs/misc/jim_morrison.png">
	<script>
	// JIMMORRISON SCRIPT
	console.log("jim morrison activated")
	let jimInput = document.querySelector("#jim-input")
	let jimText = document.querySelector("#jim-text")
	let jimFace = document.querySelector("#jim-face")

	let rules = []
	fetch("/scripts/jim_morrison.rule")
		.then(r => r.text())
		.then(r => {
			// parse the rulez
			for (let line of r.split("\n")) {
				if (line[0] == "#") continue
				let rule = line.split(/ ?=> ?/)
				if (rule.length == 2) {
					let terminator = false
					if (rule[1][0] == ".") {
						terminator = true
						rule[1] = rule[1].replace(/^. ?/, "")
					}
					if (!terminator) rule[0] = "\\b"+rule[0]+"\\b"
					rules.push({
						regex: RegExp(rule[0]),
						substitution: rule[1],
						terminator
					})
				}
			}
		})
	
	jimInput.addEventListener("change", () => {
		let prompt = jimInput.value
		jimInput.value = ""
		prompt = prompt.toLowerCase()
		let terminated = false
		let iterations = 0
		while (!terminated && iterations < 500) {
			let foundmatch = false
			for (let rule of rules) {
				let match = prompt.match(rule.regex)
				if (match) {
					foundmatch = true
					prompt = prompt.replace(rule.regex, rule.substitution)
					console.log("applying rule ", rule, "into ", prompt)
					if (rule.terminator) {
						console.log("terminating")
						terminated = true
						break
					}
				}
			}
			if (!foundmatch) {
				console.log("no matches")
				break
			}
			iterations++
		}
		console.log(prompt, iterations, terminated)
		if (terminated) {
			jimText.innerText = prompt
		} else {
			jimText.innerText = "What are you saying?"
		}
	})
	</script>
